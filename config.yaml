# LiteLLM Configuration for Beemaster

model_list:
  - model_name: nemotron
    litellm_params:
      model: deepinfra/nvidia/Nemotron-3-Nano-30B-A3B
      api_key: "os.environ/DEEPINFRA_API_KEY"

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"

litellm_settings:
  drop_params: true
  set_verbose: false

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 0.5

# Database for Virtual Key management
database:
  type: postgres
  url: "os.environ/DATABASE_URL"
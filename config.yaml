model_list:
  - model_name: nemotron
    litellm_params:
      model: deepinfra/nvidia/Nemotron-3-Nano-30B-A3B
      api_key: os.environ/DEEPINFRA_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  set_verbose: true

  # Success callback for credit tracking
  success_callback:
    - kind: http
      url: os.environ/BEEMASTER_BACKEND_URL/api/v1/credits/consume
      headers:
        X-Internal-Key: os.environ/INTERNAL_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 0.5

# Database required for virtual keys
database:
  type: postgres
  url: os.environ/DATABASE_URL
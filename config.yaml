# LiteLLM Configuration - Simple DeepInfra setup
model_list:
  - model_name: nemotron
    litellm_params:
      model: deepinfra/nvidia/Nemotron-3-Nano-30B-A3B
      api_key: os.environ/DEEPINFRA_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  set_verbose: true